<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Once P2P - Admin Panel</title>
    <style>
        body { background: #0b0f19; color: #fff; font-family: sans-serif; padding: 20px; }
        .user-card { background: #131c2e; border: 1px solid #1e293b; padding: 15px; border-radius: 10px; margin-bottom: 15px; }
        .btns { margin-top: 10px; }
        button { padding: 8px 14px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; margin-right: 8px; }
        .btn-approve { background: #10b981; color: #0b0f19; }
        .btn-reject { background: #ef4444; color: #fff; }
        img { max-width: 150px; border-radius: 6px; margin-right: 10px; border: 1px solid #334155; }
    </style>
</head>
<body>
    <h1>Admin Verification Dashboard</h1>
    <div id="users-list">Loading submissions...</div>

    <script>
        async function loadUsers() {
            const res = await fetch('/api/admin/users');
            const users = await res.json();
            const container = document.getElementById('users-list');
            
            if (users.length === 0) {
                container.innerHTML = '<p>No pending submissions found.</p>';
                return;
            }

            container.innerHTML = users.map(u => `
                <div class="user-card">
                    <h3>${u.fullName} (@${u.username})</h3>
                    <p><strong>Email:</strong> ${u.email} | <strong>Phone:</strong> ${u.phone}</p>
                    <p><strong>Binance UID:</strong> ${u.binanceId} | <strong>Status:</strong> <span style="color:${u.status==='approved'?'#10b981':u.status==='rejected'?'#ef4444':'#f59e0b'}">${u.status}</span></p>
                    <div>
                        <p><strong>ID Documents:</strong></p>
                        ${u.frontIdPath ? `<a href="/${u.frontIdPath}" target="_blank"><img src="/${u.frontIdPath}" alt="Front ID"></a>` : ''}
                        ${u.backIdPath ? `<a href="/${u.backIdPath}" target="_blank"><img src="/${u.backIdPath}" alt="Back ID"></a>` : ''}
                    </div>
                    <div class="btns">
                        <button class="btn-approve" onclick="updateStatus('${u.email}', 'approve')">Accept</button>
                        <button class="btn-reject" onclick="updateStatus('${u.email}', 'reject')">Reject</button>
                    </div>
                </div>
            `).join('');
        }

        async function updateStatus(email, action) {
            const endpoint = action === 'approve' ? '/api/admin/approve' : '/api/admin/reject';
            const res = await fetch(endpoint, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email })
            });
            const data = await res.json();
            alert(data.message);
            loadUsers();
        }

        loadUsers();
    </script>
</body>
</html>
