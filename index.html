<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Once P2P - Secure Trading</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#10b981',
                        darkbg: '#0B0F19',
                        cardbg: '#131827',
                        inputbg: '#1A2234'
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-darkbg text-slate-100 font-sans min-h-screen flex flex-col justify-between selection:bg-primary selection:text-slate-950">

    <!-- Top Navigation Bar -->
    <header class="w-full bg-cardbg/80 backdrop-blur-md border-b border-slate-800/80 px-4 py-3 flex justify-between items-center sticky top-0 z-50">
        <div class="flex items-center space-x-2">
            <div class="w-8 h-8 rounded-xl bg-primary/20 border border-primary/40 flex items-center justify-center font-bold text-primary text-sm">P</div>
            <div>
                <h1 class="font-bold text-xs tracking-wide text-white">Once <span class="text-primary">P2P</span></h1>
                <span class="text-[9px] text-slate-400 block -mt-0.5">Secure Escrow Node</span>
            </div>
        </div>
        <div class="flex items-center space-x-2">
            <span id="navStatusBadge" class="px-2.5 py-1 rounded-full text-[10px] font-bold bg-primary/10 text-primary border border-primary/25">Landing</span>
        </div>
    </header>

    <!-- Main Dynamic View Container -->
    <main id="appContainer" class="flex-1 max-w-md w-full mx-auto p-4 flex flex-col justify-center">
        <!-- Rendered dynamically by JavaScript -->
    </main>

    <!-- Footer -->
    <footer class="w-full text-center py-3 border-t border-slate-800/50 text-[10px] text-slate-500">
        Once P2P Secure Node • Encrypted Connection
    </footer>

    <!-- JavaScript Application Core -->
    <script>
        // State Management with LocalStorage persistence matching exact views requested
        let appState = {
            step: localStorage.getItem('once_p2p_step') || 'landing', // 'landing', 'register_1', 'id_verification', 'review_pending'
            legalName: localStorage.getItem('once_p2p_legal_name') || '',
            binanceId: localStorage.getItem('once_p2p_binance_id') || '',
            frontIdName: localStorage.getItem('once_p2p_front_name') || null,
            backIdName: localStorage.getItem('once_p2p_back_name') || null
        };

        function render() {
            const container = document.getElementById('appContainer');
            const badge = document.getElementById('navStatusBadge');

            if (appState.step === 'landing') {
                badge.innerText = 'Landing';
                badge.className = 'px-2.5 py-1 rounded-full text-[10px] font-bold bg-primary/10 text-primary border border-primary/25';
                
                container.innerHTML = `
                    <div class="bg-cardbg border border-slate-800/80 rounded-2xl p-6 shadow-xl text-center space-y-5">
                        <div class="w-16 h-16 bg-primary/10 border border-primary/30 rounded-2xl flex items-center justify-center mx-auto text-3xl shadow-inner shadow-primary/20">
                            🚀
                        </div>
                        <div class="space-y-2">
                            <h2 class="text-lg font-bold text-white tracking-wide">Welcome to Once P2P</h2>
                            <p class="text-xs text-slate-400 leading-relaxed">Secure, fast, and decentralized peer-to-peer crypto trading built for local payment integration.</p>
                        </div>
                        <button onclick="goToRegister1()" class="w-full py-3.5 rounded-xl bg-primary hover:bg-emerald-600 text-slate-950 font-bold text-xs transition-all cursor-pointer shadow-lg shadow-emerald-500/20">
                            Get Started
                        </button>
                    </div>
                `;
            } else if (appState.step === 'register_1') {
                badge.innerText = 'Registration 1';
                badge.className = 'px-2.5 py-1 rounded-full text-[10px] font-bold bg-primary/10 text-primary border border-primary/25';

                container.innerHTML = `
                    <div class="bg-cardbg border border-slate-800/80 rounded-2xl p-5 shadow-xl space-y-4">
                        <div class="text-center space-y-1">
                            <h2 class="text-sm font-bold text-white">Registration (Step 1)</h2>
                            <p class="text-[11px] text-slate-400">Enter your official details to setup your trader profile.</p>
                        </div>
                        <div class="space-y-3 text-xs">
                            <div>
                                <label class="text-[11px] font-semibold text-slate-300 block mb-1">Legal Full Name</label>
                                <input type="text" id="regLegalName" value="${appState.legalName}" placeholder="e.g. Abebe Kebede" class="w-full bg-inputbg border border-slate-700/80 rounded-xl p-3 text-white focus:outline-none focus:border-primary">
                            </div>
                            <div>
                                <label class="text-[11px] font-semibold text-slate-300 block mb-1">Binance UID</label>
                                <input type="text" id="regBinanceId" value="${appState.binanceId}" placeholder="e.g. 98472910" class="w-full bg-inputbg border border-slate-700/80 rounded-xl p-3 text-white focus:outline-none focus:border-primary">
                            </div>
                        </div>
                        <button onclick="submitRegister1()" class="w-full py-3 rounded-xl bg-primary hover:bg-emerald-600 text-slate-950 font-bold text-xs transition-all cursor-pointer mt-2 shadow-lg shadow-emerald-500/20">
                            Proceed to ID Verification
                        </button>
                    </div>
                `;
            } else if (appState.step === 'id_verification') {
                badge.innerText = 'Identity Verification';
                badge.className = 'px-2.5 py-1 rounded-full text-[10px] font-bold bg-primary/10 text-primary border border-primary/25';
                
                container.innerHTML = `
                    <div class="bg-cardbg border border-slate-800/80 rounded-2xl p-5 shadow-xl space-y-4">
                        <div class="text-center space-y-1">
                            <h2 class="text-sm font-bold text-white">KYC Identity Verification</h2>
                            <p class="text-[11px] text-slate-400">Please upload clear photos of the front and back of your official government-issued ID.</p>
                        </div>

                        <!-- Front ID Upload -->
                        <div class="space-y-1.5">
                            <label class="text-[11px] font-semibold text-slate-300 block">Front Side of ID</label>
                            <div onclick="document.getElementById('frontFile').click()" class="border-2 border-dashed border-slate-700 hover:border-primary/60 bg-inputbg rounded-xl p-4 text-center cursor-pointer transition-all group">
                                <input type="file" id="frontFile" accept="image/*" class="hidden" onchange="handleFileSelect('front', event)">
                                <div id="frontPreviewContainer" class="text-xs text-slate-400 group-hover:text-slate-200">
                                    <span class="block text-primary font-bold text-lg mb-1">+</span>
                                    <span id="frontFileName">${appState.frontIdName ? 'Uploaded: ' + appState.frontIdName : 'Tap to upload Front ID'}</span>
                                </div>
                            </div>
                        </div>

                        <!-- Back ID Upload -->
                        <div class="space-y-1.5">
                            <label class="text-[11px] font-semibold text-slate-300 block">Back Side of ID</label>
                            <div onclick="document.getElementById('backFile').click()" class="border-2 border-dashed border-slate-700 hover:border-primary/60 bg-inputbg rounded-xl p-4 text-center cursor-pointer transition-all group">
                                <input type="file" id="backFile" accept="image/*" class="hidden" onchange="handleFileSelect('back', event)">
                                <div id="backPreviewContainer" class="text-xs text-slate-400 group-hover:text-slate-200">
                                    <span class="block text-primary font-bold text-lg mb-1">+</span>
                                    <span id="backFileName">${appState.backIdName ? 'Uploaded: ' + appState.backIdName : 'Tap to upload Back ID'}</span>
                                </div>
                            </div>
                        </div>

                        <button id="submitIdBtn" onclick="submitVerification()" disabled class="w-full py-3 rounded-xl bg-slate-800 text-slate-500 font-bold text-xs transition-all cursor-not-allowed mt-2">
                            Submit Documents
                        </button>
                    </div>
                `;
                checkFormValidity();
            } else if (appState.step === 'review_pending') {
                badge.innerText = 'Review Pending';
                badge.className = 'px-2.5 py-1 rounded-full text-[10px] font-bold bg-amber-500/10 text-amber-400 border border-amber-500/25';

                container.innerHTML = `
                    <div class="bg-cardbg border border-slate-800/80 rounded-2xl p-6 shadow-2xl text-center space-y-5">
                        <div class="w-16 h-16 bg-amber-500/10 border border-amber-500/30 rounded-full flex items-center justify-center mx-auto text-2xl shadow-inner shadow-amber-500/20 animate-pulse">
                            ⏳
                        </div>

                        <div class="space-y-1.5">
                            <h2 class="text-base font-bold text-white tracking-wide">ID Verification Under Review</h2>
                            <p class="text-[11px] text-slate-400 leading-relaxed px-2">Your identity documents have been submitted securely. Our compliance team is cross-checking your legal details.</p>
                        </div>

                        <div class="bg-inputbg border border-slate-800/80 rounded-xl p-4 text-left space-y-3 text-xs">
                            <div class="flex justify-between items-center border-b border-slate-800/80 pb-2.5">
                                <span class="text-slate-400">Status:</span>
                                <span class="font-bold text-amber-400">Pending Manual Audit</span>
                            </div>
                            <div class="flex justify-between items-center border-b border-slate-800/80 pb-2.5">
                                <span class="text-slate-400">Estimated Time:</span>
                                <span class="font-bold text-slate-200">1 - 24 Hours</span>
                            </div>
                            <div class="flex justify-between items-center">
                                <span class="text-slate-400">Security Check:</span>
                                <span class="font-bold text-primary">Encrypted & Queued</span>
                            </div>
                        </div>

                        <button onclick="resetTestingState()" class="w-full py-3 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-300 font-bold text-xs transition-all cursor-pointer border border-slate-700/50">
                            Reset Status (For Testing)
                        </button>

                        <p class="text-[10px] text-slate-500 px-4">
                            You will receive a notification in Telegram once your account verification status is updated.
                        </p>
                    </div>
                `;
            }
        }

        function goToRegister1() {
            appState.step = 'register_1';
            localStorage.setItem('once_p2p_step', 'register_1');
            render();
        }

        function submitRegister1() {
            const legalName = document.getElementById('regLegalName').value.trim();
            const binanceId = document.getElementById('regBinanceId').value.trim();

            if (!legalName || !binanceId) {
                alert('Please fill in both Legal Name and Binance ID.');
                return;
            }

            appState.legalName = legalName;
            appState.binanceId = binanceId;
            localStorage.setItem('once_p2p_legal_name', legalName);
            localStorage.setItem('once_p2p_binance_id', binanceId);

            appState.step = 'id_verification';
            localStorage.setItem('once_p2p_step', 'id_verification');
            render();
        }

        function handleFileSelect(side, event) {
            const file = event.target.files[0];
            if (file) {
                if (side === 'front') {
                    appState.frontIdName = file.name;
                    localStorage.setItem('once_p2p_front_name', file.name);
                    document.getElementById('frontFileName').innerText = 'Uploaded: ' + file.name;
                    document.getElementById('frontFileName').className = 'text-primary font-bold';
                } else {
                    appState.backIdName = file.name;
                    localStorage.setItem('once_p2p_back_name', file.name);
                    document.getElementById('backFileName').innerText = 'Uploaded: ' + file.name;
                    document.getElementById('backFileName').className = 'text-primary font-bold';
                }
                checkFormValidity();
            }
        }

        function checkFormValidity() {
            const btn = document.getElementById('submitIdBtn');
            if (!btn) return;
            if (appState.frontIdName && appState.backIdName) {
                btn.disabled = false;
                btn.className = "w-full py-3 rounded-xl bg-primary hover:bg-emerald-600 text-slate-950 font-bold text-xs transition-all cursor-pointer mt-2 shadow-lg shadow-emerald-500/20";
            } else {
                btn.disabled = true;
                btn.className = "w-full py-3 rounded-xl bg-slate-800 text-slate-500 font-bold text-xs transition-all cursor-not-allowed mt-2";
            }
        }

        function submitVerification() {
            appState.step = 'review_pending';
            localStorage.setItem('once_p2p_step', 'review_pending');
            render();
        }

        function resetTestingState() {
            localStorage.clear();
            appState = {
                step: 'landing',
                legalName: '',
                binanceId: '',
                frontIdName: null,
                backIdName: null
            };
            render();
        }

        // Initialize view on load
        window.onload = function() {
            render();
        };
    </script>
</body>
</html>
