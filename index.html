<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Once P2P - Identity Verification</title>
    <style>
        body {
            background-color: #0b0f19;
            color: #ffffff;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background-color: #161b22;
            padding: 30px;
            border-radius: 12px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        h2 { margin-bottom: 5px; color: #ffffff; }
        p { color: #8b949e; font-size: 14px; margin-bottom: 20px; }
        label { display: block; font-size: 12px; font-weight: bold; margin-bottom: 5px; color: #8b949e; }
        input[type="file"] {
            width: 100%;
            padding: 10px;
            background: #0d1117;
            border: 1px solid #30363d;
            border-radius: 6px;
            color: #ffffff;
            margin-bottom: 15px;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            background-color: #1f883d;
            color: white;
            padding: 12px;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
        }
        button:hover { background-color: #2ea043; }
        #review-status-section { text-align: center; }
    </style>
</head>
<body>

    <div class="card">
        <div id="verify-section">
            <h2>Verify Your Identity</h2>
            <p>Upload clear photos of your ID document (Front and Back) to access the platform.</p>
            
            <label>SELECT FRONT ID</label>
            <input type="file" id="front-id-input" accept="image/*">
            
            <label>SELECT BACK ID</label>
            <input type="file" id="back-id-input" accept="image/*">
            
            <button id="submit-id-btn">Submit ID for Review</button>
        </div>

        <div id="review-status-section" style="display: none;">
            <h2>Review in Progress</h2>
            <p>Your verification documents have been successfully submitted. Please wait for admin approval to access trading features.</p>
        </div>
    </div>

    <script>
        document.getElementById('submit-id-btn').addEventListener('click', async () => {
            const frontFile = document.getElementById('front-id-input').files[0];
            const backFile = document.getElementById('back-id-input').files[0];

            if (!frontFile || !backFile) {
                alert('Please select both the Front and Back images of your ID.');
                return;
            }

            const formData = new FormData();
            formData.append('frontId', frontFile);
            formData.append('backId', backFile);

            try {
                // Show loading state or disable button if desired
                const response = await fetch('/api/verify-id', {
                    method: 'POST',
                    body: formData
                });

                if (response.ok) {
                    // Instantly hide form and display review text on the same page
                    document.getElementById('verify-section').style.display = 'none';
                    document.getElementById('review-status-section').style.display = 'block';
                } else {
                    alert('Upload failed. Please try again.');
                }
            } catch (err) {
                console.error(err);
                alert('Network error during upload.');
            }
        });
    </script>
</body>
</html>
